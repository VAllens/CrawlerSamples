name: Bug report
description: Report a problem with the crawler sample
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please include enough detail to reproduce the issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands / actions
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: .NET SDK version
      placeholder: e.g. 10.0.302
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / exception
      render: shell
